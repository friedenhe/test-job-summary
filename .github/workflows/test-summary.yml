name: Test Job Summary

on:
  workflow_dispatch:

jobs:
  test-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip artifact
        run: unzip -q llm-test-results-26988984471.zip

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-preview-001-airfoil-pressure-profile-preview-${{ github.run_id }}
          path: airfoil_cfd_rae2822_aoa1_1cpu_0000/plots/airfoil_pressure_profile.png

      - name: Upload preview artifact 2
        uses: actions/upload-artifact@v4
        with:
          name: llm-preview-002-wing-pressure-flow-field-preview-${{ github.run_id }}
          path: wing_cfd_wing_s809_naca2412_aoa1_0000/plots/wing_flow_field_p_3d.png

      - name: Wait for artifacts to be indexed
        run: sleep 3

      - name: Prepare images directory
        run: |
          mkdir -p images/run-${{ github.run_id }}
          cp airfoil_cfd_rae2822_aoa1_1cpu_0000/plots/airfoil_pressure_profile.png images/run-${{ github.run_id }}/
          cp wing_cfd_wing_s809_naca2412_aoa1_0000/plots/wing_flow_field_p_3d.png images/run-${{ github.run_id }}/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images

      - name: Generate summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: python3 ${{ github.workspace }}/summary.py
