name: Test Job Summary

on:
  workflow_dispatch:

jobs:
  test-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip artifact
        run: unzip -q llm-test-results-26988984471.zip

      - name: Debug - Check files exist
        run: |
          echo "=== Listing unzipped contents ==="
          ls -la llm-test-results-26988984471/ | head -20
          echo ""
          echo "=== Checking airfoil file ==="
          ls -lh llm-test-results-26988984471/airfoil_cfd_rae2822_aoa1_1cpu_0000/plots/airfoil_pressure_profile.png || echo "NOT FOUND"
          echo ""
          echo "=== Checking wing file ==="
          ls -lh llm-test-results-26988984471/wing_cfd_wing_s809_naca2412_aoa1_0000/plots/wing_flow_field_p_3d.png || echo "NOT FOUND"

      - name: Upload preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-preview-001-airfoil-pressure-profile-preview-${{ github.run_id }}
          path: llm-test-results-26988984471/airfoil_cfd_rae2822_aoa1_1cpu_0000/plots/airfoil_pressure_profile.png

      - name: Upload preview artifact 2
        uses: actions/upload-artifact@v4
        with:
          name: llm-preview-002-wing-pressure-flow-field-preview-${{ github.run_id }}
          path: llm-test-results-26988984471/wing_cfd_wing_s809_naca2412_aoa1_0000/plots/wing_flow_field_p_3d.png

      - name: Wait for artifacts to be indexed
        run: sleep 3

      - name: Generate summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ${{ github.workspace }}/summary.py
